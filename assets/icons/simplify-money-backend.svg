<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="t"><title id="t">Simplify Money logo</title><style>.v{transform-box:view-box}.coin0{animation:stack 4s cubic-bezier(.3,1.3,.5,1) 0.3s infinite}.coin1{animation:stack 4s cubic-bezier(.3,1.3,.5,1) 0.15s infinite}.coin2{animation:stack 4s cubic-bezier(.3,1.3,.5,1) 0s infinite}.coin3{animation:stack 4s cubic-bezier(.3,1.3,.5,1) 0.45s infinite}@keyframes stack{0%{transform:translateY(-10px);opacity:0}18%{transform:none;opacity:1}82%{transform:none;opacity:1}100%{transform:none;opacity:0}}.spark{transform-origin:90px 26px;animation:twinkle 2.2s ease-in-out infinite}@keyframes twinkle{50%{transform:scale(.55) rotate(45deg);opacity:.5}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><radialGradient id="lift" cx="28%" cy="18%" r="95%"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect x="2" y="2" width="116" height="116" rx="30" fill="#4a3412"/><rect x="2" y="2" width="116" height="116" rx="30" fill="url(#lift)"/><rect x="2.5" y="2.5" width="115" height="115" rx="29.5" fill="none" stroke="#fff" stroke-opacity=".09"/><g fill="none" stroke="#f6f1e7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path class="coin2" d="M34 64V76C34 81 46 85 60 85C74 85 86 81 86 76V64"/><path class="coin1" d="M34 52V64C34 69 46 73 60 73C74 73 86 69 86 64V52"/><path class="coin0" d="M34 40V52C34 57 46 61 60 61C74 61 86 57 86 52V40"/><ellipse class="coin3" cx="60" cy="40" rx="26" ry="9" fill="#ffd87a"/><path class="spark v" d="M90 16L92.5 23.5L100 26L92.5 28.5L90 36L87.5 28.5L80 26L87.5 23.5Z" fill="#ffd87a" stroke="none"/></g></svg>